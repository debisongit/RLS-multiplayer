# Publishes a GitHub Release.
#  - push a tag like v0.4.13, or
#  - run it by hand (Actions > Release > Run workflow) with the version number.
# The release has a ready-to-copy zip (server plugin + client mod) and the changelog entry for that version.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, for example 0.4.13"
        required: true
      notes:
        description: "Also replace the text of an existing release with release/NOTES-<version>.md (true or false)"
        required: false
        default: "false"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ github.event.inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "BUILD=$v" >> "$GITHUB_ENV"
      - name: Build the release folder
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 luajit
          tools/make_release.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have="$(grep -o 'BUILD = "[^"]*"' Resources/Server/RLS-Career-MP/lua/rlsmp/shared/transfer.lua | cut -d'"' -f2)"
          [ "$have" = "$BUILD" ] || { echo "Code is build $have but you asked for $BUILD"; exit 1; }
          if gh release view "v$BUILD" >/dev/null 2>&1; then
            # The release page already exists (made by hand): just attach the zip and leave the text alone.
            gh release upload "v$BUILD" "release/RLS-Career-MP-$BUILD.zip" --clobber
            if [ "${{ github.event.inputs.notes }}" = "true" ]; then
              gh release edit "v$BUILD" --notes-file "release/NOTES-$BUILD.md" --title "RLS-Career-MP $BUILD"
            fi
          else
            gh release create "v$BUILD" "release/RLS-Career-MP-$BUILD.zip" --target "$GITHUB_SHA" \
              --title "RLS-Career-MP $BUILD" --notes-file "release/NOTES-$BUILD.md" --prerelease
          fi
